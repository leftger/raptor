[package]
name = "raptor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Realtime Abstracted Path Tree Observer"
authors = ["Erick Jesus <erick.jesus2060@gmail.com>"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["3d", "ui"] }
bytesize = "2.2.0"
dirs = "6.0.0"
font8x8 = "0.3"

# Procedural music. Glicol is local-only at 0.14.0-dev; pin a git rev before release.
glicol = { path = "../music-stuff/glicol/rs/main" }
# Raw output stream. We drive cpal directly instead of enabling `bevy_audio`.
cpal = "0.18"
# Lock-free handoff between the Bevy control side and the audio render thread.
crossbeam-channel = "0.5"

[features]
default = []
dev = ["bevy/dynamic_linking"]

[package.metadata.bundle]
name = "raptor"
identifier = "com.erickj3.raptor"
category = "Utility"

[package.metadata.bundle.osx]
minimum_system_version = "10.11"

[[bin]]
name = "raptor"
path = "src/main.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = true
